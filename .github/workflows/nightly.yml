name: Nightly Builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare nightly packages
        shell: bash
        run: |
          PLUGIN_FILE=$(find dist -maxdepth 1 -name 'Spoolman-for-Duet-*.zip' -print -quit)
          BRIDGE_FILE=$(find dist -maxdepth 1 -name 'spoolman-for-duet-bridge-*.zip' -print -quit)

          cp "$PLUGIN_FILE" dist/Spoolman-for-Duet-nightly.zip
          cp "$BRIDGE_FILE" dist/spoolman-for-duet-bridge-nightly.zip

      - name: Publish or update Nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Spoolman for Duet - Nightly
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ## Spoolman for Duet - Nightly Build

            This is a development build of Spoolman for Duet.

            Nightly builds contain the latest changes and may be unstable.
            For normal use, install the latest tagged release instead.
          files: |
            dist/Spoolman-for-Duet-nightly.zip
            dist/spoolman-for-duet-bridge-nightly.zip
            scripts/install-bridge-nightly.sh
